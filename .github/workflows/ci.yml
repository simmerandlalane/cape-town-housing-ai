name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint (incl. bandit security rules)
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (offline; no API keys needed)
        run: uv run pytest -q
      - name: Evaluation against hand-labelled real results (fails below 90%)
        run: uv run python evals/run.py --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
